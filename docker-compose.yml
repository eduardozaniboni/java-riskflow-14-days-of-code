version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: riskflow-postgres
    environment:
      POSTGRES_DB: riskflow
      POSTGRES_USER: riskflow
      POSTGRES_PASSWORD: riskflow123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: riskflow-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: